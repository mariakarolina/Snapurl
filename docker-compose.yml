version: "3.9"

services:
  server:
    build:
      context: ./server
    container_name: snapurl-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    networks:
      - snapurl-net

  client:
    build:
      context: ./client
    container_name: snapurl-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - snapurl-net

networks:
  snapurl-net:
    driver: bridge
